[project]
name = "pinetext"
version = "0.4.0"
description = "PineText"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pinecone>=10.0.0",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
pinetext = "pinetext.cli:app"

[project.optional-dependencies]
observability = [
    "opentelemetry-proto>=1.44.0",
    "wandb>=0.30.0",
    "weave>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "ty>=0.0.82",
]
